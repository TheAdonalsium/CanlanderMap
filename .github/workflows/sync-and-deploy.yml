name: Sync and deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily at 11:17 UTC. Odd minute on purpose — GitHub's scheduler is
    # congested on the hour and jobs get delayed there.
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Pull the sheet, flatten it, geocode anything new, commit if it changed.
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build data from sheet
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
        run: python scripts/build_data.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Sheet unchanged — nothing to commit."
          else
            git commit -m "Sync store list"
            git push
          fi

  # Publish main. Runs after sync so a fresh pull goes live in the same run,
  # and on plain pushes so editing the page deploys it.
  deploy:
    needs: [sync]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main rather than the triggering SHA, so we pick up whatever the
      # sync job just pushed.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
